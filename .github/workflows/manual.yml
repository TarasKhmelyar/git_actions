name: CI

on:
  pull_request:
    types: [opened,synchronize]
    branches: 
      - main
      - jenk
      - test-brch
  workflow_dispatch:

jobs:
  my-first-job:
    runs-on: ubuntu-latest
        
    steps:
      - name: CHECKOUT
        uses: actions/checkout@v4
        with:
          ref: test-brch

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Check Java version
        run: "java -version"

      - name: show dir
        run: "pwd"

      - name: list file
        run: "ls -al"

      - name: install depend
        working-directory: ./GitAction
        run: "mvn compile"

      - name: build
        working-directory: ./GitAction
        run: "mvn package -DskipTests"

      - name: test
        working-directory: ./GitAction
        run: "mvn test"

      - name: secret
        run: echo "${{secrets.MY_SECRET}}"
